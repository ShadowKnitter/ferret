<div class="col-sm-6 col-md-4 col-lg-4" style="padding-bottom: 3dvh">
    <div class="card">
    <h1 class="itemTitle centered"><span id="itemName"></span></h1>
    <button class="btn btn-primary iconBtn centered" type="button" id="linkBtn" style="padding: 0px 0px;">
        <img id="image" alt="image failed to load" class="align-middle" style="width: 80%;">
    </button>
    <h1 class="centered itemPrice" style="margin: 0px;"><span id="price"></span></h1>
    <h3 class="centered itemSale" style="margin: 0px;"><s><span id="oldPrice"></span></s><span id="percentOff"></span></h3>
    <h2 class="centered itemRating" style="padding-top: 3dvh;">Rating</h2>
    <h3 class="centered itemRatingLabel"><span id="rating"></span>/5</h3>
    <div class="progress">
        <div id="ratingBar" class="progress-bar progress-bar-striped progress-bar-animated bg-warning" role="progressbar" style="height: 2dvh; width: 1%;" aria-valuemin="0" aria-valuemax="5"></div>
    </div>
    <div class="bs-component centered" style="padding: 3dvh 0px;">
        <div class="row">
        <div class="col-sm-6">
            <button class="btn btn-primary iconBtn centered" type="button" id="addToCartBtn" style="padding: 0px 0px;">
            <img src="img/CartBtn.png" id="cartBtnImg" alt="Add to Cart" class="align-middle centered" style="width: 80%;">
            </button>
        </div>
        <div class="col-sm-6">
            <button class="btn btn-primary iconBtn centered" type="button" id="addToWishlistBtn" style="padding: 0px 0px;">
            <img src="img/WishlistBtn.png" id="wishlistBtnImg" alt="Add to Wishlist" class="align-middle centered" style="width: 80%;">
            </button>
        </div>
        </div>
    </div>
    </div>
</div>
