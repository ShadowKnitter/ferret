<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopping App</title>
  <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"> -->
  <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.8/dist/darkly/bootstrap.min.css" rel="stylesheet">
  <link href="./gui.css" rel="stylesheet">
</head>

<body class="overflow-hidden h-100">
  <div class="bs-docs-section">
    <div class="row">

      <!-- Side bar -->
      <div class="col-sm-3">
        <div class="bs-component">
          <div class="card vh-100 " style="border-radius: 0px 20px 20px 0px">

            <div class="bs-component" style="height: 33dvh">
              <h1 class="title centered">$<span id="budget"></span></h1>
              <div class="row">
                <div class="col-sm-6">
                  <button id="cartBtn" type="button" class="btn btn-primary iconBtn" style="padding: 1dvh 0px;">
                    <img src="img/Cart.png" alt="Cart" class="align-middle" style="height: 18dvh; width: 18dvh;">
                  </button>
                </div>
                <div class="col-sm-6">
                    <h2 id="sideBarSpacing" class="small"><span id="items"></span></h2>
                    <h2 id="sideBarSpacing" class="small">$<span id="fCost"></span></h2>
                </div>
              </div>
            </div>

            <div class="bs-component" style="height: 33dvh">
              <h1 class="title centered">Sort</h1>
              <fieldset class="fs-5">
                <div class="form-check centered">
                  <input class="form-check-input" type="radio" name="optionsRadios" id="optionsRadios1" value="option1" checked="">
                  <label class="form-check-label" for="optionsRadios1">ㅤRating</label>
                </div>
                <div class="form-check centered">
                  <input class="form-check-input" type="radio" name="optionsRadios" id="optionsRadios2" value="option2">
                  <label class="form-check-label" for="optionsRadios2">ㅤPrice</label>
                </div>
                <div class="form-check centered">
                  <input class="form-check-input" type="radio" name="optionsRadios" id="optionsRadios3" value="option3">
                  <label class="form-check-label" for="optionsRadios3">ㅤOn Sale</label>
                </div>
              </fieldset>
            </div>

            <div class="bs-component" style="height: 33dvh">
              <h1 class="title centered">Wishlist</h1>
              <div class="bs-component centered">
                <button id="wishlistBtn" type="button" class="btn btn-primary iconBtn" >
                  <img src="img/Wishlist.png" alt="Wishlist" class="align-middle centered" style="height: 20dvh; width: 20dvh;">
                </button>
              </div>
            </div>

          </div>
        </div>
      </div>

      <!-- Search -->
      <div class="col-sm-8">
        <div class="bs-component">

          <!-- Search Bar -->
          <div class="container-fluid" style="padding-top: 2dvh">
            <div class="input-group mb-3">
              <input type="text" id="searchBar" class="form-control search" placeholder="Search"
                aria-label="Search Bar" aria-describedby="button-addon2">
              <button class="btn btn-primary search centered" type="button" id="searchBtn">Search</button>
            </div>
          </div>

          <!-- Results -->
          <div class="overflow-y-auto" style="height: 91dvh; scrollbar-width: none; overflow-x: clip;">
            <div class="bs-docs-section">
              <div class="row">

                <!-- item 1 -->
                <div class="col-sm-4" style="padding-bottom: 3dvh">
                  <div class="card" style="height: 90dvh">


                    
                    <h1 class="itemTitle centered"><span id="itemName"></span></h1>
                    <button class="btn btn-primary iconBtn centered" type="button" id="linkBtn" style="padding: 0px 0px;">
                      <img id="image" alt="image failed to load" class="align-middle" style="height: 25dvh; width: 25dvh;">
                    </button>
                    <h1 class="centered" style="margin: 0px;">$<span id="price"></span></h1>
                    <h3 class="tiny centered" style="margin: 0px;"><s><span id="oldPrice"></span></s><span id="percentOff"></span></h3>
                    <h2 class="small centered" style="padding-top: 3dvh;">Rating</h2>
                    <h3 class="tiny centered"><span id="rating"></span>/5</h3>
                    <div class="progress">
                      <div id="ratingBar" class="progress-bar progress-bar-striped progress-bar-animated bg-warning" role="progressbar" style="height: 2dvh; width: 1%;" aria-valuemin="0" aria-valuemax="5"></div>
                    </div>
                    <div class="bs-component centered" style="padding: 3dvh 0px;">
                      <div class="row">
                        <div class="col-sm-6">
                          <button class="btn btn-primary iconBtn centered" type="button" id="addToCartBtn" style="padding: 0px 0px;">
                            <img src="img/CartBtn.png" alt="Add to Cart" class="align-middle centered" style="height: 10dvh; width: 10dvh;">
                          </button>
                        </div>
                        <div class="col-sm-6">
                          <button class="btn btn-primary iconBtn centered" type="button" id="addToWishlistBtn" style="padding: 0px 0px;">
                            <img src="img/WishlistBtn.png" alt="Add to Wishlist" class="align-middle centered" style="height: 10dvh; width: 10dvh;">
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="col-sm-4" style="padding-bottom: 3dvh">
                  <div class="card" style="height: 90dvh">
                  </div>
                </div>

                <div class="col-sm-4" style="padding-bottom: 3dvh">
                  <div class="card" style="height: 90dvh"> 
                  </div>
                </div>

              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Settings -->
      <div class="col-sm-1" style="padding: 1vh">
        <div class="bs-component">
          <button type="button" id="settingsBtn" class="btn btn-primary iconBtn" style="padding: 0px 0px;">
            <img src="img/Settings.png" alt="Settings" class="align-middle" style="height: 10dvh; width: 10dvh;">
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-4.0.0.min.js"
    integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
  <script src="./shopping.js"></script>
  <script src="./sideBar.js"></script>
  <script src="./testSearch.js"></script>
</body>

</html>
