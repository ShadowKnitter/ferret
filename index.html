<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopping App</title>
  <link rel="icon" type="image/x-icon" href="/Ferret.png">

  <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.8/dist/darkly/bootstrap.min.css" rel="stylesheet">
  <link href="./gui.css" rel="stylesheet">
</head>

<body class="overflow-hidden h-100">
  <div class="bs-docs-section">
    <div class="row">

      <!-- Side bar -->
      <div class="col-sm-3">
        <div class="bs-component">
          <div class="card vh-100 " style="border-radius: 0px 20px 20px 0px">

            <div class="bs-component" style="height: 33dvh">
              <h1 class="title centered">$<span id="budget"></span></h1>
              <div class="row">
                <div class="col-sm-6">
                  <button id="cartBtn" type="button" class="btn btn-primary iconBtn" style="padding: 1dvh 0px;">
                    <img src="img/Cart.png" alt="Cart" class="align-middle" style="width: 80%;">
                  </button>
                </div>
                <div class="col-sm-6">
                    <h2 id="sideBarSpacing" class="sideBarContent"><span id="items"></span></h2>
                </div>
                <h2 id="sideBarSpacing" class="sideBarContent centered">$<span id="fCost"></span></h2>
              </div>
            </div>

            <div class="bs-component" style="height: 33dvh">
              <h1 class="title centered">Sort</h1>
              <fieldset class="fs-5" id="resultSorts">
                <div class="form-check centered">
                  <input class="form-check-input" type="radio" name="optionsRadios" id="ratingSort" value="ratingSort" checked="">
                  <label class="form-check-label sideBarRadio" for="ratingSort">ㅤRating</label>
                </div>
                <div class="form-check centered">
                  <input class="form-check-input" type="radio" name="optionsRadios" id="priceSort" value="priceSort">
                  <label class="form-check-label sideBarRadio" for="priceSort">ㅤPrice</label>
                </div>
                <div class="form-check centered">
                  <input class="form-check-input" type="radio" name="optionsRadios" id="saleSort" value="saleSort">
                  <label class="form-check-label sideBarRadio" for="saleSort">ㅤOn Sale</label>
                </div>
              </fieldset>
            </div>

            <div class="bs-component" style="height: 33dvh">
              <h1 class="title centered">Wishlist</h1>
              <div class="bs-component centered">
                <button id="wishlistBtn" type="button" class="btn btn-primary iconBtn" >
                  <img src="img/Wishlist.png" alt="Wishlist" class="align-middle centered" style="width: 60%;">
                </button>
              </div>
            </div>

          </div>
        </div>
      </div>

      <!-- Search -->
      <div class="col-sm-9">
        <div class="bs-component">

          <!-- Search Bar -->
          <div class="container-fluid" style="padding-top: 2dvh">
            <div class="input-group mb-3">
              <input type="text" id="searchBar" class="form-control search" placeholder="Search"
                aria-label="Search Bar" aria-describedby="button-addon2">
              <button class="btn btn-primary search centered" type="button" id="searchBtn">Search</button>
            </div>
          </div>

          <!-- Results -->
          <div class="overflow-y-auto custom-scrollbar scrollbarMargin" style="height: 91dvh; overflow-x: clip;">
            <div class="bs-docs-section scrollbarMargin">
              <div class="row" id="results">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-4.0.0.min.js"
    integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
  <script src="./shopping.js"></script>
  <script src="./testSearch.js"></script>
</body>

</html>
